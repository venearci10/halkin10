<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Inteligente - Venearci</title>
    <!-- Enlace al archivo de estilos separados -->
<!-- La ruta correcta con una 'c' y doble 's' -->
<link rel="stylesheet" href="styles.css?v=1.1">
<link rel="manifest" href="./manifest.json">
    
</head>
<body>
<div class="container">
    <div class="header">
        <img src="https://raw.githubusercontent.com/venearci10/halkin10/refs/heads/main/Halkin1.png" width="180px" height="170px">
        <h1>Plataforma Halkin 10</h1>
        <p id="header-desc">Ángel José Arcila Parra</p>

    </div>

<!-- PASO 1: ACCESO INICIAL -->
<section id="step-email" class="step-section active">
    
    <form id="form-email-check">
        <div class="input-group">
            <label>Correo Electrónico</label>
            <input type="email" id="user-email" required placeholder="halkin1@venearci.com">
        </div>
        <div class="input-group">
            <label>Contraseña (Opcional)</label>
            <input type="password" id="login-password-init" placeholder="********">
        </div>
        <button type="button" id="btn-login-password" class="btn btn-entrar">Entrar</button>
    </form>
    <div style="text-align: center; margin-top: 15px;">
   
    <a href="#" id="link-olvide-password" style="color: #fff; text-decoration: none; font-size: 14px;">¿Olvidaste tu contraseña?</a>
</div>

    <div class="divisor" style="margin: 20px 0; text-align: center; color: white;">¿Eres nuevo?</div>

    <div class="registro-zona">
        <button type="button" id="btn-ir-a-registro" class="btn btn-entrar">Registrarse →</button>
    </div>
    
</section>
 
    <!-- PASO 2A: REGISTRO DE NUEVO USUARIO -->
    <div id="step-register" class="step-section">
        <form id="form-completar-registro">
            <div class="input-group">
                <label for="reg-username">Elige tu ID único (Nombre de usuario)</label>
                <div class="username-prefix">
                    <input type="text" id="reg-username" placeholder="tu_usuario" required>
                </div>
            </div>
            <div class="input-group">
                <label for="reg-fullname">Nombre Completo</label>
                <input type="text" id="reg-fullname" placeholder="Ej: Ángel Arcila" required>
            </div>
            <div class="input-group">
                <label for="reg-password">Contraseña (De respaldo)</label>
                <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required>
            </div>
            <button type="submit" class="btn btn-success">Guardar y Vincular Huella </button>
        </form>
    </div>

    <!-- PASO 2B: INICIO DE SESIÓN BIOMÉTRICO (USUARIO EXISTENTE) -->
   <div id="step-login" class="step-section">
    <button type="button" id="btn-activar-huella" class="btn btn-login">
      <img src="https://raw.githubusercontent.com/venearci10/halkin10/refs/heads/main/Hu2.png" width="60px" height="60px">
    </button>
 <br>   
    <div class="divisor"></div>
<center>
    
     <button type="submit" class="btn btn-verificar" style="margin-top: 10px;">
    <a href="#" id="link-usar-password" class="toggle-link">Entrar con contraseña de respaldo</a></center>
</button>

    <form id="form-password-fallback" style="display: none; margin-top: 15px;">
        <div class="input-group">
            <label for="login-password">Introduce tu contraseña</label>
            <input type="password" id="login-password" required placeholder="********">
        </div>
        <button type="submit" class="btn btn-verificar" style="margin-top: 10px;">Verificar Contraseña</button>
    </form>
</div>

    <!-- Alertas y Estado de procesos -->
    <div id="status-message" class="status-box"></div>
</div>

    <div id="pwa-install-banner" class="fixed bottom-4 left-4 right-4 bg-gray-900 text-white p-4 rounded-xl shadow-2xl border border-gray-800 z-50 transform translate-y-20 opacity-0 transition-all duration-500 flex flex-col sm:flex-row justify-between items-center space-y-3 sm:space-y-0 sm:space-x-4 max-w-md mx-auto hidden">
      <div class="flex items-center space-x-3">
        <img src="https://raw.githubusercontent.com/venearci10/venearci-network/main/venearci-logo.png" alt="Venearci Logo" class="w-10 h-10 object-contain rounded-lg shadow-md" />
        <div>
          <p class="font-bold text-base text-white">Instalar Venearci Network</p>
          <p class="text-xs text-gray-400">Descarga la app en tu teléfono para usarla a pantalla completa.</p>
        </div>
      </div>
      <div class="flex space-x-2 w-full sm:w-auto justify-end">
        <button id="pwa-close-btn" class="px-3 py-1.5 text-xs font-semibold text-gray-400 hover:text-white transition-colors">Ahora no</button>
        <button id="pwa-install-btn" class="px-4 py-1.5 text-xs font-bold bg-white text-black rounded-lg hover:bg-gray-200 transition-colors shadow-sm">Instalar</button>
      </div>
    </div>

    <script>
      let deferredPrompt;
      const banner = document.getElementById('pwa-install-banner');
      const installBtn = document.getElementById('pwa-install-btn');
      const closeBtn = document.getElementById('pwa-close-btn');

      // 1. Registro correcto del Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(() => console.log('PWA Service Worker registrado'))
            .catch(err => console.log('Error:', err));
        });
      }

      // 2. Capturar el evento de instalación para mostrar el aviso automáticamente
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        
        // Hace aparecer el aviso flotante con animación
        banner.classList.remove('hidden');
        setTimeout(() => {
          banner.classList.remove('translate-y-20', 'opacity-0');
        }, 150);
      });

      // 3. Acción al presionar el botón "Instalar"
      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('El usuario eligió:', outcome);
        deferredPrompt = null;
        ocultarBanner();
      });

      // 4. Acción al presionar "Ahora no"
      closeBtn.addEventListener('click', () => {
        ocultarBanner();
      });

      function ocultarBanner() {
        banner.classList.add('translate-y-20', 'opacity-0');
        setTimeout(() => {
          banner.classList.add('hidden');
        }, 500);
      }

      window.addEventListener('appinstalled', () => {
        console.log('Aplicación instalada con éxito');
        ocultarBanner();
      });
    </script>
     <script>
        
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register("./sw.js')
        .then(() => console.log('PWA Service Worker registrado'))
        .catch(err => console.log('Error:', err));
    });
  }
</script>
<!-- Enlace al archivo lógico tipo módulo para soportar imports de Firebase -->
<script type="module" src="appscript4.js"></script>
</body>
</html>
